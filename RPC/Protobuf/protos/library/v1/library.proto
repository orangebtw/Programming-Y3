syntax = "proto3";

package library.v1;

import "google/protobuf/timestamp.proto";

enum Genre {
    GENRE_UNSPECIFIED = 0;
    GENRE_FICTION = 1;
    GENRE_SCIENCE = 2;
    GENRE_HISTORY = 3;
}

message Author {
    string name = 1;
    optional int32 birth_year = 2;
}

message Book {
    int64 id = 1;
    string title = 2;
    repeated Author authors = 3;
    Genre genre = 4;
    map<string, string> attributes = 5;
    google.protobuf.Timestamp published_at = 6;
    oneof source {
        string isbn = 7;
        string ebook_url = 8;
    }
}

message Catalog {
    repeated Book books = 1;
}